# Spring Boot application properties for local development

spring.datasource.url=jdbc:postgresql://localhost:5432/hostel_management
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# Swagger/OpenAPI config
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Optionally, customize the path:
# springdoc.swagger-ui.path=/swagger-ui.html

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

public.api.security.key=your_public_api_key_here
